<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edie review</title>
<style>body{font:16px system-ui;background:#111827;color:#eee;max-width:1100px;margin:auto;padding:32px}input,button,textarea,select{font:inherit;padding:10px;border-radius:6px;border:1px solid #64748b;background:#1f2937;color:white}button{cursor:pointer}article{border:1px solid #475569;border-radius:12px;padding:20px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#cbd5e1}video{max-width:100%;max-height:500px}label{display:block;margin:12px 0}.muted{color:#94a3b8}</style>
<h1>Edie</h1><p>Private editorial workspace · drafts require human review</p>
<label>Management token <input id="token" type="password" autocomplete="off"></label><button id="connect">Load jobs</button><p id="status" role="status"></p><main id="jobs"></main>
<script>
const $=s=>document.querySelector(s);let bearer='';const blobs=[];
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+bearer,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}
function el(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e}
async function event(job,state,kind,payload){await api('/jobs/'+job+'/events',{event_id:crypto.randomUUID(),expected_state_version:state.version,type:kind,payload,actor:'dashboard-operator'});await load()}
async function load(){try{$('#status').textContent='Loading…';for(const url of blobs)URL.revokeObjectURL(url);blobs.length=0;$('#jobs').replaceChildren();for(const job of await api('/jobs')){const card=el('article',undefined,$('#jobs'));el('h2',job.brief.goal,card);el('p',job.id,card);let state;try{state=await api('/jobs/'+job.id+'/workflow')}catch{el('p','Workflow not started',card);continue}el('p','Stage: '+state.stage+' · '+state.control+' · version '+state.version,card);el('pre',JSON.stringify({plan:state.plan,question:state.question,script:state.script,validation:state.validation,usage:state.usage},null,2),card);
for(const action of ['pause','resume','cancel']){const b=el('button',action,card);b.onclick=()=>event(job.id,state,action,{}).catch(showError)}
if(state.pending_task){const task=await api('/tasks/'+state.pending_task);el('p','Render: '+task.state,card);if(task.state==='completed'){const b=el('button','Load preview',card);b.onclick=async()=>{try{const r=await fetch('/tasks/'+task.id+'/artifact',{headers:{Authorization:'Bearer '+bearer}});if(!r.ok)throw Error('Preview unavailable');const url=URL.createObjectURL(await r.blob());blobs.push(url);const v=el('video',undefined,card);v.controls=true;v.src=url;b.disabled=true}catch(e){showError(e)}}}}
if(state.revision){const text=el('textarea',undefined,card);text.placeholder='Feedback for this revision';const time=el('input',undefined,card);time.type='number';time.min=0;time.value=0;time.title='Timestamp in seconds';const b=el('button','Submit timestamped feedback',card);b.onclick=()=>event(job.id,state,'feedback',{revision:state.revision,timestamp:Number(time.value),text:text.value}).catch(showError)}
for(const scope of ['script','main','final']){const candidate=state.candidate_hashes[scope];if(candidate){const b=el('button','Approve '+scope,card);b.onclick=()=>{if(confirm('Approve this exact '+scope+' candidate?'))event(job.id,state,'approve',{scope,candidate}).catch(showError)}}}
el('pre',JSON.stringify({approvals:state.approvals,delivery:state.delivery},null,2),card)}$('#status').textContent='Loaded. Token stays only in this tab’s memory.'}catch(e){showError(e)}}
function showError(e){$('#status').textContent=e.message}$('#connect').onclick=()=>{bearer=$('#token').value;$('#token').value='';load()};
</script></html>
