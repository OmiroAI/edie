x-runtime: &runtime
  build: .
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  edie:
    <<: *runtime
    profiles: [cli]
    network_mode: none
    volumes:
      - ${EDIE_MEDIA:?Set authorised media directory}:/media:ro
      - ${EDIE_STATE:?Set private state directory}:/state
  api:
    <<: *runtime
    entrypoint: [python, -m, edie.api]
    environment:
      EDIE_STATE: /state
      EDIE_BIND: 0.0.0.0
      EDIE_API_TOKEN: ${EDIE_API_TOKEN:?Set private management token}
    ports: ["127.0.0.1:${EDIE_PORT:-8080}:8080"]
    networks: [management]
    volumes:
      - ${EDIE_STATE:?Set private state directory}:/state
  worker:
    <<: *runtime
    entrypoint: [python, -m, edie.worker, --state, /state, --media, /media]
    network_mode: none
    init: true
    volumes:
      - ${EDIE_MEDIA:?Set authorised media directory}:/media:ro
      - ${EDIE_STATE:?Set private state directory}:/state
networks:
  management:
    internal: true
