[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "edie"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opentimelineio==0.18.1", "otio-fcp-adapter==1.0.0", "jsonschema==4.26.0"]
[project.scripts]
edie = "edie.cli:main"

[tool.setuptools.package-data]
edie = ["dashboard.html"]
